# ==========================================================================================
# RMVPE mel->f0 config. Inherits all wave/mel/f0/data/seq_l/task/training/early-stopping keys from
# configs/base_pitch.yaml and adds ONLY the RMVPE backbone (2D DeepUNet + GRU, ~90M params).
# The FCPE counterpart is configs/fcpe.yaml — both share base_pitch.yaml => a fair A/B on the same
# precomputed features (data/pitch_prediction).
#
# RMVPETask (training/rmvpe_task.py) builds the RMVPE E2E backbone; all data/loss/validation logic is
# shared with FCPE in PitchBaseTask. Preprocess once with `python process.py --config configs/fcpe.yaml`
# (FCPE & RMVPE share the data).
# Train:
#   python train.py --config configs/rmvpe.yaml --exp_name rmvpe_unified
# ==========================================================================================
base_config:
  - configs/base_pitch.yaml

task_cls : training.rmvpe_task.RMVPETask

# RMVPE backbone (2D DeepUNet + GRU). en_de_layers is RMVPE-only: DeepUNet depth AND the dataset's
# time_multiple (= 2**en_de_layers) that validation clips are padded to. Keep seq_l divisible: 256 % 32 == 0.
en_de_layers : 5
n_blocks : 4
inter_layers : 4
in_channels : 1
en_out_channels : 16
n_gru : 1

# RMVPE is ~90M params (vs FCPE ~10M). If you OOM at the inherited batch_size (64), override here:
# batch_size : 32
